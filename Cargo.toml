[package]
name = "uvc"
version = "2026.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "uvc_ext"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
numpy = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"
nix = { version = "0.30", features = ["fs", "poll", "inotify"] }

[features]
default = []
