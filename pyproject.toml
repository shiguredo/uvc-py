[build-system]
requires = ["scikit-build-core", "nanobind>=2.10.2"]
build-backend = "scikit_build_core.build"

[project]
name = "uvc-py"
authors = [{ name = "Shiguredo Inc.", email = "contact+pypi@shiguredo.jp" }]
dynamic = ["version"]
description = "Cross-platform UVC camera library binding for Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: C++",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.12"

[project.urls]
Source = "https://github.com/shiguredo/uvc-py"
Discord = "https://discord.gg/shiguredo"

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "example" },
    { include-group = "lint" },
]
test = ["pytest", "pytest-timeout", "numpy"]
example = ["raw-player"]
lint = ["ruff", "ty"]

[tool.scikit-build]
minimum-version = "0.11.3"
sdist.include = ["VERSION"]
build-dir = "_build"

[tool.scikit-build.cmake]
version = ">=4.2"

[tool.scikit-build.build]
verbose = false

[tool.scikit-build.wheel]
packages = ["src/uvc"]
expand-macos-universal-tags = true

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "^(?P<value>.+)$"

[tool.uv]
package = false
managed = true
python-preference = "only-managed"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
