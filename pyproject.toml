[build-system]
requires = ["maturin>=1.11,<2.0"]
build-backend = "maturin"

[project]
name = "uvc-py"
authors = [{ name = "Shiguredo Inc.", email = "contact+pypi@shiguredo.jp" }]
dynamic = ["version"]
description = "Cross-platform UVC camera library binding for Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Rust",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.12"

[project.urls]
Source = "https://github.com/shiguredo/uvc-py"
Discord = "https://discord.gg/shiguredo"

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "example" },
    { include-group = "lint" },
]
test = ["pytest", "pytest-timeout", "numpy"]
example = ["raw-player"]
lint = ["ruff", "ty"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "uvc.uvc_ext"

[tool.uv]
package = false
managed = true
python-preference = "only-managed"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
